<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 01</title>
</head>
<body>
    <script>

let numCerto = 7;
let num;

do {
    num = Number(prompt("Escreva um número de 1 à 10: "));

    if (num !== numCerto) {
        alert("Você não acertou o número! Tente novamente!");
    }
   


} while (num !== numCerto);


alert("Você acertou o número!");


    </script>
</body>
</html>
